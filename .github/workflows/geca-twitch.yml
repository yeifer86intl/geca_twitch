name: GECA Twitch - transaccional cada 4 horas

on:
  schedule:
    - cron: '17 */4 * * *'  # UTC: Venezuela 00:17, 04:17, 08:17, 12:17, 16:17, 20:17
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: geca-twitch-state
  cancel-in-progress: false

jobs:
  ingesta-y-agregados:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Recuperar ultimo SQLite
        run: python scripts/restore_latest_artifact.py
      - name: Ingesta transaccional Steam/Twitch
        id: ingestion
        run: |
          PYTHONPATH=src python -m geca_twitch.ingest \
            --steam data/steam_maestro_20261103.csv \
            --db state/geca_twitch.sqlite3 \
            --tracked-limit 120 --rotation-limit 30 \
            --fuzzy-limit 20 --discover-limit 100 \
            --max-streams 300 --max-videos 100 --max-clips 100
      - name: Agregados diarios, alertas y exportaciones
        if: always()
        run: PYTHONPATH=src python -m geca_twitch.aggregate --db state/geca_twitch.sqlite3 --out outputs
      - name: Guardar estado histórico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geca-twitch-state
          path: state/geca_twitch.sqlite3
          if-no-files-found: warn
          retention-days: 30
      - name: Archivos analíticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geca-twitch-exports
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
