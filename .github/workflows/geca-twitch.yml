name: GECA Twitch - transaccional cada 4 horas

on:
  schedule:
    - cron: '17 */4 * * *' # UTC; Venezuela 20:17 (día anterior), 00:17, 04:17, 08:17, 12:17, 16:17
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: geca-twitch-state
  cancel-in-progress: false

jobs:
  ingesta-y-agregados:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas unitarias
        run: python -m unittest discover -s tests -v
      - name: Validar secretos
        run: |
          python -c "import os,sys; sys.exit(0 if os.getenv('TWITCH_CLIENT_ID') and os.getenv('TWITCH_CLIENT_SECRET') else 1)"
      - name: Recuperar último SQLite
        run: python scripts/restore_latest_artifact.py
      - name: Ingesta transaccional Steam/Twitch
        run: |
          STEAM_FILE="$(python scripts/select_steam_master.py)"
          echo "Maestro seleccionado: $STEAM_FILE"
          python -m geca_twitch.ingest \
            --steam "$STEAM_FILE" \
            --db state/geca_twitch.sqlite3 \
            --discover-limit 0 \
            --max-videos 500 --clip-hours 8
      - name: Agregados, evaluación y exportaciones
        if: always()
        run: |
          if [ -f state/geca_twitch.sqlite3 ]; then
            python -m geca_twitch.aggregate --db state/geca_twitch.sqlite3 --out outputs
          fi
      - name: Guardar SQLite histórico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geca-twitch-state
          path: state/geca_twitch.sqlite3
          if-no-files-found: warn
          retention-days: 30
      - name: Guardar reportes CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geca-twitch-exports
          path: outputs/
          if-no-files-found: warn
          retention-days: 30
